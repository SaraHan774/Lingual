# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# ── JVM / Daemon ─────────────────────────────────────────────────────────────
# Heap: 2 GB is the practical sweet spot for a single-module Compose+Hilt+KSP project.
# MaxMetaspaceSize caps metaspace to prevent runaway growth.
# -XX:+HeapDumpOnOutOfMemoryError catches silent OOM crashes.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m \
  -XX:+HeapDumpOnOutOfMemoryError \
  -Dfile.encoding=UTF-8

# Keep the Gradle daemon alive between builds (default true, but explicit is safer).
org.gradle.daemon=true

# Reuse configuration-phase output when inputs haven't changed.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ── Parallelism ───────────────────────────────────────────────────────────────
# Single-module project still benefits from parallel task execution within the module.
org.gradle.parallel=true
org.gradle.workers.max=4

# ── Incremental & caching ─────────────────────────────────────────────────────
org.gradle.caching=true

# ── Android ───────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true

# Suppress legacy Jetifier (no Support-library artifacts in this project).
android.enableJetifier=false

# R8 full mode: smaller APK, faster dex step in release builds.
android.enableR8.fullMode=true

# ── Kotlin ────────────────────────────────────────────────────────────────────
kotlin.code.style=official

# Incremental annotation processing for KSP / Hilt.
kapt.incremental.apt=true
kapt.use.worker.api=true
